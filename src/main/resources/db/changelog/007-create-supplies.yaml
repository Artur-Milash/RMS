databaseChangeLog:
  - changeSet:
      id: 007-create-supplies
      author: milash
      changes:

        - createTable:
            tableName: supplies
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: added_quantity
                  type: DECIMAL(12,3)
                  constraints:
                    nullable: false

              - column:
                  name: supply_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: supplies
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_supply_product

        - addForeignKeyConstraint:
            baseTableName: supplies
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_supply_user
