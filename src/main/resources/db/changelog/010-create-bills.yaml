databaseChangeLog:
  - changeSet:
      id: 010-create-bills
      author: milash
      changes:

        - createTable:
            tableName: bills
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: total_amount
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: payment_method
                  type: VARCHAR(30)

              - column:
                  name: payment_time
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: bills
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_bill_order
