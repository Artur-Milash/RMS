databaseChangeLog:
  - changeSet:
      id: 002-create-restaurant-tables
      author: milash
      changes:

        - createTable:
            tableName: restaurant_tables
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: number
                  type: INTEGER
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: seats_count
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
