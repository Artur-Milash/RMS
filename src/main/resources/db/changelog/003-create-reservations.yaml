databaseChangeLog:
  - changeSet:
      id: 003-create-reservations
      author: milash
      changes:

        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: table_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: customer_phone
                  type: VARCHAR(50)

              - column:
                  name: reservation_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reservations
            baseColumnNames: table_id
            referencedTableName: restaurant_tables
            referencedColumnNames: id
            constraintName: fk_reservation_table
