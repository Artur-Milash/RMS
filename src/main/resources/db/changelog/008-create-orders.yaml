databaseChangeLog:
  - changeSet:
      id: 008-create-orders
      author: milash
      changes:

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: table_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: waiter_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: table_id
            referencedTableName: restaurant_tables
            referencedColumnNames: id
            constraintName: fk_order_table

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: waiter_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_order_waiter
