databaseChangeLog:
  - changeSet:
      id: 006-create-recipe-items
      author: milash
      changes:

        - createTable:
            tableName: recipe_items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: menu_item_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: required_quantity
                  type: DECIMAL(12,3)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: recipe_items
            baseColumnNames: menu_item_id
            referencedTableName: menu_items
            referencedColumnNames: id
            constraintName: fk_recipe_menu_item

        - addForeignKeyConstraint:
            baseTableName: recipe_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_recipe_product

        - addUniqueConstraint:
            tableName: recipe_items
            columnNames: menu_item_id, product_id
            constraintName: uq_recipe_menu_product
