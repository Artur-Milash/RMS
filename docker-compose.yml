x-app: &app
  image: restaurant-management-system:latest
  build:
    context: .
    dockerfile: DockerFile
  restart: unless-stopped
  environment: &app-environment
    DB_URL: jdbc:postgresql://postgres:5432/restaurant
    DB_USERNAME: restaurant
    DB_PASSWORD: restaurant
    JWT_SECRET: S6Uh7swW1znwYbA1/VzExps5Bw4QxDQsujdUaBtO8vg=
    JWT_EXPIRATION_SECONDS: 3600

services:
  postgres:
    image: postgres:17
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5432:5432"
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U restaurant -d restaurant" ]
      interval: 5s
      timeout: 5s
      retries: 5

  restaurant-service:
    <<: *app
    container_name: restaurant-service
    ports:
      - "8080:8080"
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: restaurant
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    <<: *app
    container_name: orders-service
    ports:
      - "8081:8080"
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: orders
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  restaurant_postgres_data:
